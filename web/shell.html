<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="chi-tea-aye">
  <meta name="theme-color" content="#14171c">
  <title>chi-tea-aye</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #14171c;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      overscroll-behavior: none;
      position: fixed;
      top: 0;
      left: 0;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      /* dvh follows the visible area on mobile browsers with collapsing toolbars. */
      height: 100dvh;
      outline: none;
      position: absolute;
      top: 0;
      left: 0;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #14171c;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 0 16px;
      text-align: center;
    }
    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #fault {
      display: none;
      pointer-events: auto;
      background-color: rgba(20, 23, 28, 0.94);
      z-index: 20;
    }
    #fault button {
      margin-top: 1rem;
      font: inherit;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      border: 1px solid #3a404c;
      background: #232730;
      color: #f0f0f0;
      cursor: pointer;
    }
    .loading-title {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 1.25rem;
      color: #f0f0f0;
    }
    .progress-track {
      width: min(320px, 80vw);
      height: 6px;
      background: #232730;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: #4a9eff;
      transition: width 0.15s ease;
    }
    #status, #fault-text {
      font-size: 0.85rem;
      color: #8b949e;
      max-width: 36rem;
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>

  <div id="loading" class="overlay">
    <div class="loading-title">chi-tea-aye</div>
    <div class="progress-track">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
    <div id="status">Loading game assets...</div>
  </div>

  <div id="fault" class="overlay">
    <div class="loading-title" id="fault-title">Something went wrong</div>
    <div id="fault-text"></div>
    <button type="button" onclick="location.reload()">Reload</button>
  </div>

  <script>
    var statusElement = document.getElementById('status');
    var progressBar = document.getElementById('progress-bar');
    var loadingOverlay = document.getElementById('loading');
    var canvasElement = document.getElementById('canvas');

    // One place to show a fatal problem, with a reload button, instead of a frozen canvas.
    function showFault(title, text) {
      document.getElementById('fault-title').textContent = title;
      document.getElementById('fault-text').textContent = text || '';
      document.getElementById('fault').style.display = 'flex';
      if (loadingOverlay) loadingOverlay.style.display = 'none';
    }

    // The game needs WebGL 2 (every current browser has it, including Safari 15 and later).
    var hasWebGL2 = (function() {
      try {
        return !!document.createElement('canvas').getContext('webgl2');
      } catch (e) {
        return false;
      }
    })();

    // A lost context (GPU reset, driver update, too many tabs) would leave a frozen
    // canvas. Cancelling the default tells the browser we will recover; recovery here
    // is a reload, which rebuilds every GL resource from scratch.
    canvasElement.addEventListener('webglcontextlost', function(e) {
      e.preventDefault();
      showFault('Graphics were reset', 'The browser reset the GPU. The game will reload when graphics come back.');
    }, false);
    canvasElement.addEventListener('webglcontextrestored', function() {
      location.reload();
    }, false);

    var Module = {
      canvas: canvasElement,
      setStatus: function(text) {
        if (!text) {
          if (loadingOverlay) {
            loadingOverlay.classList.add('hidden');
            setTimeout(function() { loadingOverlay.style.display = 'none'; }, 350);
          }
          return;
        }
        if (statusElement) statusElement.textContent = text;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        if (m && progressBar) {
          var current = parseFloat(m[2]);
          var total = parseFloat(m[4]);
          progressBar.style.width = Math.min(100, Math.round((current / total) * 100)) + '%';
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        if (left) {
          Module.setStatus('Preparing assets... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')');
        } else {
          Module.setStatus('');
        }
      },
      onAbort: function(what) {
        // Keep the first, more specific message (no WebGL 2, lost context).
        if (document.getElementById('fault').style.display === 'flex') return;
        showFault('The game stopped', String(what || 'An unexpected error stopped the game.'));
      }
    };

    if (!hasWebGL2) {
      showFault('WebGL 2 is not available', 'This browser or device cannot run the game. Try an up-to-date Chrome, Edge, Firefox or Safari, and check that hardware acceleration is on.');
    }

    // Keyboard focus follows the canvas, so keys reach the game after any click.
    canvasElement.addEventListener('pointerdown', function() { canvasElement.focus(); });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function(err) {
          console.log('PWA ServiceWorker registration failed:', err);
        });
      });
    }
  </script>
  {{{ SCRIPT }}}
</body>
</html>
